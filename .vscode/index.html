<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Skibidi vs Ohio – Mini Invaders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="banner-wrap" id="bannerWrap" aria-live="polite"></div>

  <canvas id="game" width="720" height="480" aria-label="Skibidi vs Ohio game canvas"></canvas>
  <div class="ui">
    <div class="row">
      <button id="skibidi">Play as Skibidi 🚽</button>
      <button id="ohio">Play as Ohio 🛑</button>
    </div>
    <div class="row controls">
      <button id="restart">Restart ⟲</button>
      <button id="superShot">Super Shot ✦</button>
      <button id="autoFire">Auto-Fire: Off</button>
    </div>
    <p class="hint">Move: ← → or A/D &nbsp;|&nbsp; Shoot: Space &nbsp;|&nbsp; (No sound)</p>
  </div>
  <script src="script.js"></script>
  <script>
    (function(){
      const exists = name => typeof window[name] === 'function';
      const $ = id => document.getElementById(id);
      const restartBtn = $('restart');
      const superBtn = $('superShot');
      const autoBtn = $('autoFire');

      if(restartBtn){
        restartBtn.addEventListener('click', ()=>{
          if(exists('reset')){
            try{ window.reset(); }catch(e){ location.reload(); }
          } else {
            location.reload();
          }
        });
      }

      if(superBtn){
        superBtn.addEventListener('click', ()=>{
          if(exists('shoot')){
            // fire a short burst of shots as a "super" move
            try{
              window.shoot(); window.shoot(); window.shoot();
            }catch(e){ /* ignore if shoot not available */ }
          }
        });
      }

      let autoInterval = null;
      if(autoBtn){
        autoBtn.addEventListener('click', ()=>{
          if(autoInterval){
            clearInterval(autoInterval);
            autoInterval = null;
            autoBtn.textContent = 'Auto-Fire: Off';
          } else {
            if(!exists('shoot')) return;
            autoInterval = setInterval(()=>{ try{ window.shoot(); }catch(e){} }, 180);
            autoBtn.textContent = 'Auto-Fire: On';
          }
        });
      }
    })();
  </script>
</body>
</html>
