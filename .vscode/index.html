<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Skibidi vs Ohio – Mini Invaders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="banner-wrap" id="bannerWrap" aria-live="polite"></div>

  <canvas id="game" width="720" height="480" aria-label="Skibidi vs Ohio game canvas"></canvas>
  <div class="ui">
    <div class="row">
      <button id="skibidi">Play as Skibidi 🚽</button>
      <button id="ohio">Play as Ohio 🛑</button>
    </div>
    <p class="hint">Move: ← → or A/D &nbsp;|&nbsp; Shoot: Space &nbsp;|&nbsp; (No sound)</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
